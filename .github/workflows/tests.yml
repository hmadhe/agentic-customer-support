# Runs the fast unit tests on every push and pull request.
# They use fakes, so they need no Ollama, models, vector store or databases (real-model tests are skipped).
name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q --cov=app --cov-report=term-missing
